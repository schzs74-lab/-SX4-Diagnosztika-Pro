name: Android APK fordítás
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
      - name: Java 17 telepítése
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 telepítése
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK beállítása
        uses: android-actions/setup-android@v3
      - name: Android 35 SDK telepítése
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Debug APK építése
        run: gradle :app:assembleDebug --stacktrace
      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Diagnosztika-Pro-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
