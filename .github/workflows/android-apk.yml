name: Android APK fordítás
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Monoton növekvő versionCode: minden új APK frissítésként telepíthető a korábbira.
      APP_BUILD_NUMBER: ${{ github.run_number }}
      APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SX4_KEYSTORE_BASE64: ${{ secrets.SX4_KEYSTORE_BASE64 }}
      SX4_KEYSTORE_PASSWORD: ${{ secrets.SX4_KEYSTORE_PASSWORD }}
      SX4_KEY_ALIAS: ${{ secrets.SX4_KEY_ALIAS }}
      SX4_KEY_PASSWORD: ${{ secrets.SX4_KEY_PASSWORD }}
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
      - name: Java 17 telepítése
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 telepítése
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK beállítása
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android 35 SDK telepítése
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Állandó aláírókulcs előkészítése (ha a titkok be vannak állítva)
        if: env.SX4_KEYSTORE_BASE64 != ''
        run: |
          echo "$SX4_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sx4-release.jks"
          echo "SX4_KEYSTORE_FILE=$RUNNER_TEMP/sx4-release.jks" >> "$GITHUB_ENV"
      - name: Figyelmeztetés aláírókulcs nélkül
        if: env.SX4_KEYSTORE_BASE64 == ''
        run: echo "::warning::Nincs SX4_KEYSTORE_BASE64 titok. A debug APK futásonként eltérő, ideiglenes kulccsal készül, ezért nem telepíthető frissítésként a korábbi APK-ra (adatvesztéssel járó eltávolítás kellene). Lásd docs/CLAUDE_AUDIT.md, 5. fejezet."
      - name: OBD és TCP tesztek, lint, debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Aláírt release APK (csak állandó kulccsal)
        if: env.SX4_KEYSTORE_FILE != ''
        run: gradle :app:assembleRelease --stacktrace
      - name: APK-k elnevezése verzió szerint
        run: |
          mkdir -p dist
          for type in debug release; do
            dir="app/build/outputs/apk/$type"
            [ -f "$dir/output-metadata.json" ] || continue
            name=$(jq -r '.elements[0].versionName' "$dir/output-metadata.json")
            file=$(jq -r '.elements[0].outputFile' "$dir/output-metadata.json")
            cp "$dir/$file" "dist/SX4-Diagnosztika-Pro-$name-$type.apk"
          done
          ls -l dist
          [ -n "$(ls dist/*-debug.apk 2>/dev/null)" ]
      - name: Tesztjelentések feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SX4-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Diagnosztika-Pro-APK-build${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
